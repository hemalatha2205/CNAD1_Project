services:
  - type: web
    name: logisphere-auth
    runtime: docker
    plan: free
    dockerContext: ./LogiSphere/backend/auth-service
    dockerfilePath: ./LogiSphere/backend/auth-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8082"
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:logisphere_auth_db;DB_CLOSE_DELAY=-1;MODE=MySQL
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: sa
      - key: JWT_SECRET
        generateValue: true
