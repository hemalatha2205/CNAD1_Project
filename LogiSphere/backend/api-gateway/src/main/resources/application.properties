spring.application.name=api-gateway

server.port=${PORT:${SERVER_PORT:8080}}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH:true}

spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# AUTH SERVICE
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URL:lb://AUTH-SERVICE}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# PRODUCT SERVICE
spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${PRODUCT_SERVICE_URL:lb://PRODUCT-SERVICE}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/products/**

# INVENTORY SERVICE
spring.cloud.gateway.server.webmvc.routes[2].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${INVENTORY_SERVICE_URL:lb://INVENTORY-SERVICE}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/inventory/**

# ORDER SERVICE
spring.cloud.gateway.server.webmvc.routes[3].id=order-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${ORDER_SERVICE_URL:lb://ORDER-SERVICE}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/orders/**

# SHIPMENT SERVICE
spring.cloud.gateway.server.webmvc.routes[4].id=shipment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${SHIPMENT_SERVICE_URL:lb://SHIPMENT-SERVICE}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/shipments/**

# DELIVERY SERVICE
spring.cloud.gateway.server.webmvc.routes[5].id=delivery-service
spring.cloud.gateway.server.webmvc.routes[5].uri=${DELIVERY_SERVICE_URL:lb://DELIVERY-SERVICE}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/assignments/**

# DELIVERY PERSON SERVICE
spring.cloud.gateway.server.webmvc.routes[6].id=delivery-person-service
spring.cloud.gateway.server.webmvc.routes[6].uri=${DELIVERY_PERSON_SERVICE_URL:lb://DELIVERY-SERVICE}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/delivery-persons/**

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=api-gateway
