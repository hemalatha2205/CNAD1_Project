spring.application.name=auth-service

server.port=${PORT:${SERVER_PORT:8082}}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/logisphere_auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# HikariCP pool tuning for cloud free-tier databases (TiDB / Aiven / RDS)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

jwt.secret=${JWT_SECRET:LogiSphereSuperSecretKeyForJWTAuthentication2026}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH:true}

service.delivery.url=${SERVICE_DELIVERY_URL:http://localhost:8087}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=auth-service
