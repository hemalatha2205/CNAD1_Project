spring.application.name=delivery-service

server.port=${SERVER_PORT:8087}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/logisphere_delivery_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${DELIVERY_KAFKA_GROUP_ID:delivery-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
