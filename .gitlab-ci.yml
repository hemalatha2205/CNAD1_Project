stages:
  - test
  - build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ci_root_password
  JWT_SECRET: "LogiSphereCISecretKey2026ForJwtSigningOnly123456"

cache:
  paths:
    - .m2/repository/
    - frontend/node_modules/

.backend_template: &backend_definition
  image: maven:3.9-eclipse-temurin-21
  stage: test
  services:
    - name: mysql:8.0
      variables:
        MYSQL_ROOT_PASSWORD: ci_root_password
        MYSQL_ROOT_HOST: "%"
  variables:
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: ci_root_password
  before_script:
    - apt-get update -qq && apt-get install -y -qq default-mysql-client
    - |
      for i in $(seq 1 60); do
        if mysqladmin ping -h mysql -uroot -pci_root_password --connect-timeout=3 --silent; then
          echo "MySQL is ready"
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "MySQL failed to start"; mysqladmin ping -h mysql -uroot -pci_root_password --connect-timeout=3 2>&1 || true; getent hosts mysql || true
          exit 1
        fi
        sleep 2
      done
    - |
      mysql -h mysql -uroot -pci_root_password -e "
      CREATE DATABASE IF NOT EXISTS logisphere_auth_db;
      CREATE DATABASE IF NOT EXISTS logisphere_delivery_db;
      CREATE DATABASE IF NOT EXISTS logisphere_inventory_db;
      CREATE DATABASE IF NOT EXISTS logisphere_order_db;
      CREATE DATABASE IF NOT EXISTS logisphere_product_db;
      CREATE DATABASE IF NOT EXISTS logisphere_shipment_db;
      "
  script:
    - cd "$SERVICE_DIR"
    - mvn test -B

test:eureka-server:
  <<: *backend_definition
  variables:
    SERVICE_DIR: backend/eureka-server

test:api-gateway:
  <<: *backend_definition
  variables:
    SERVICE_DIR: backend/api-gateway

test:auth-service:
  <<: *backend_definition
  variables:
    SERVICE_DIR: backend/auth-service
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/logisphere_auth_db

test:product-service:
  <<: *backend_definition
  variables:
    SERVICE_DIR: backend/product-service
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/logisphere_product_db

test:inventory-service:
  <<: *backend_definition
  variables:
    SERVICE_DIR: backend/inventory-service
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/logisphere_inventory_db

test:order-service:
  <<: *backend_definition
  variables:
    SERVICE_DIR: backend/order-service
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/logisphere_order_db

test:shipment-service:
  <<: *backend_definition
  variables:
    SERVICE_DIR: backend/shipment-service
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/logisphere_shipment_db

test:delivery-service:
  <<: *backend_definition
  variables:
    SERVICE_DIR: backend/delivery-service
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/logisphere_delivery_db

frontend:build:
  image: node:20-alpine
  stage: build
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
